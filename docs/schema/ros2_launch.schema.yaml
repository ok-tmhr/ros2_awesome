# yaml-language-server: $schema=https://json-schema.org/draft/2020-12/schema
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/ok-tmhr/ros2_schema/refs/heads/external-schema/schema/ros2_launch.schema.yaml
type: object
properties:
  launch:
    $ref: "#/$defs/launch"
$defs:
  launch:
    oneOf:
      - $ref: "#/$defs/children"
      - type: object
        properties:
          deprecated:
            type: string
          children:
            $ref: "#/$defs/children"
        required: [children]
  children:
    type: array
    items:
      $ref: "#/$defs/action"
  action:
    type: object
    oneOf:
      - properties:
          append_env:
            $ref: "#/$defs/append_env"
        required: [append_env]
  actionBase:
    type: object
    properties:
      if:
        $ref: "#/$defs/booleanString"
      unless:
        $ref: "#/$defs/booleanString"
    not:
      required:
        - if
        - unless
  booleanString:
    oneOf:
      - type: string
        pattern: "^\\s*[01]\\s*$"
      - type: string
        pattern: "^\\s*[Tt][Rr][Uu][Ee]\\s*$"
      - type: string
        pattern: "^\\s*[Ff][Aa][Ll][Ss][Ee]\\s*$"
      - $ref: "#/$defs/substitution"
  substitution:
    type: string
    pattern: \$\(.+\)
  append_env:
    type: object
    allOf:
      - $ref: "#/$defs/actionBase"
    properties:
      name:
        type: string
        description: the name of the environment variable
      value:
        type: string
        description: the value to set or append
      prepend:
        type: boolean
        description: whether the value should be prepended instead
      separator:
        type: string
        description: "the separator to use, defaulting to a platform-specific separator"
    required:
      - name
      - value
    unevaluatedProperties: false
    description: >-
      Action that appends to an environment variable if it exists and sets it if
      it does not.

      It can optionally prepend instead of appending. It can also optionally use
      a custom separator, with the default being a platform-specific separator,
      os.pathsep.


      https://docs.ros.org/en/jazzy/p/launch/launch.actions.append_environment_variable.html
    examples:
      - launch:
          - append_env:
              name: env_variable
              value: env_var_value
      - launch:
          - append_env:
              name: env_variable
              value: env_var_value
              prepend: true
              separator: ":"
